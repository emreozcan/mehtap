[tool.poetry]
name = "mehtap"
version = "0.0.0"
description = "Lua programming language written in Python"
authors = ["Emre Özcan <emre@emreis.com>"]
readme = "README.md"
license = "MIT"
keywords = ["lua", "parser", "interpreter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Lua",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries",
]
repository = "https://github.com/emreozcan/mehtap"
documentation = "https://mehtap.readthedocs.io/en/latest/"

[tool.poetry.scripts]
mehtap = "mehtap.__main__:main"

[tool.poetry.dependencies]
python = ">=3.11"
lark = "^1.3.1"
attrs = "^26.1.0"
prompt-toolkit = "^3.0.53"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
coverage = "^7.17.3"
mypy = "^2.4.1"
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
freezegun = "^1.5.5"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^9.0.4"
furo = "^2025.12.19"
myst-parser = "^5.2.0"
sphinx-autobuild = "^2025.8.25"
sphinx-copybutton = "^0.5.2"
sphinx-inline-tabs = "^2025.12.21.14"
sphinx-tippy = "^0.4.3"
dunamai = "^1.26.5"

[tool.poetry-dynamic-versioning]
enable = true

[tool.poetry-dynamic-versioning.substitution]
folders = [
    { path = "src/mehtap" }
]

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.pytest.ini_options]
addopts = "-vv --import-mode=importlib --cov=mehtap --cov-report html --cov-report xml --junitxml=junit.xml -o junit_family=legacy"
pythonpath = "src"
testpaths = "tests"

[tool.black]
line-length = 80

[tool.mypy]
python_version = "3.11"
